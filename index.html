<head>

<title>Apps</title>
<style>
:root{--bg:#f6faf7;--fg:#17201b;--muted:#5b6b61;--card:#ffffff;--line:#dbe7df;--accent:#2e9e6b}
@media (prefers-color-scheme:dark){:root{--bg:#101412;--fg:#e3ebe6;--muted:#9fb1a6;--card:#18201c;--line:#2a362f;--accent:#7fd3a5}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif}
main{max-width:760px;margin:0 auto;padding:32px 16px 64px}

table{border-collapse:collapse;width:100%;background:var(--card);font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600}
footer{margin-top:48px;color:var(--muted);font-size:14px}
